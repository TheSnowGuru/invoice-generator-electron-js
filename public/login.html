<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — MyFinance</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --border: rgba(148, 163, 184, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }
      .layout {
        max-width: 420px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: calc(100dvh - 48px);
        justify-content: center;
      }
      .card {
        padding: 28px 24px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--surface);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      label {
        display: block;
        text-align: left;
        font-size: 0.85rem;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 1rem;
      }
      button[type='submit'] {
        width: 100%;
        margin-top: 14px;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #0f172a;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button[type='submit']:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .error {
        color: #f87171;
        font-size: 0.9rem;
        margin: 10px 0 0;
        min-height: 1.2em;
      }
      .install {
        padding: 16px 18px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.45);
        text-align: left;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .install h2 {
        margin: 0 0 10px;
        font-size: 0.95rem;
        color: var(--text);
      }
      .install ol {
        margin: 0;
        padding-left: 1.2rem;
        line-height: 1.5;
      }
      .install li + li {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="card">
        <h1>MyFinance</h1>
        <p>Sign in to open the web app.</p>
        <form id="login">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
          <p class="error" id="error" aria-live="polite"></p>
          <button type="submit" id="submit">Sign in</button>
        </form>
      </div>
      <div class="install" id="install-hint">
        <h2>Install on iPad / phone</h2>
        <ol>
          <li>Use <strong>Safari</strong> on iPad or iPhone.</li>
          <li>Tap <strong>Share</strong> → <strong>Add to Home Screen</strong> → <strong>Add</strong>.</li>
          <li>Open <strong>MyFinance</strong> from your Home Screen (full-screen app).</li>
        </ol>
      </div>
    </div>
    <script>
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
        document.getElementById('install-hint')?.remove();
      }
      const form = document.getElementById('login');
      const errorEl = document.getElementById('error');
      const submit = document.getElementById('submit');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        submit.disabled = true;
        const password = document.getElementById('password').value;
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          if (res.ok) {
            window.location.href = '/';
            return;
          }
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || 'Sign in failed.';
        } catch {
          errorEl.textContent = 'Network error. Try again.';
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
