<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — MyFinance</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --border: rgba(148, 163, 184, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }
      .card {
        width: min(100%, 380px);
        padding: 28px 24px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--surface);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      label {
        display: block;
        text-align: left;
        font-size: 0.85rem;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 1rem;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #0f172a;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .error {
        color: #f87171;
        font-size: 0.9rem;
        margin: 10px 0 0;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>MyFinance</h1>
      <p>Sign in to open the web app.</p>
      <form id="login">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <p class="error" id="error" aria-live="polite"></p>
        <button type="submit" id="submit">Sign in</button>
      </form>
    </div>
    <script>
      const form = document.getElementById('login');
      const errorEl = document.getElementById('error');
      const submit = document.getElementById('submit');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        submit.disabled = true;
        const password = document.getElementById('password').value;
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
          });
          if (res.ok) {
            window.location.href = '/';
            return;
          }
          const data = await res.json().catch(() => ({}));
          errorEl.textContent = data.error || 'Sign in failed.';
        } catch {
          errorEl.textContent = 'Network error. Try again.';
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
