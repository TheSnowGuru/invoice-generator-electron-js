name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (Vite + Electron)
        run: npm run build

      - name: Package macOS
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (Vite + Electron)
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive PWA password hash
        run: |
          if [ -n "${{ secrets.PWA_PASSWORD }}" ]; then
            HASH=$(printf '%s' "${{ secrets.PWA_PASSWORD }}" | sha256sum | awk '{print $1}')
            echo "VITE_PWA_PASSWORD_HASH=$HASH" >> "$GITHUB_ENV"
          fi

      - name: Build PWA (iPad / mobile browser)
        run: npm run build:pwa

      - name: Zip PWA for self-hosting
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist
          zip -r "../MyFinance-${VERSION}-pwa-web.zip" .
          cd ..
          ls -la "MyFinance-${VERSION}-pwa-web.zip"

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: MyFinance-*-pwa-web.zip
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npm run cap:sync:ios

      - name: Build iOS app (unsigned archive for sideload tooling)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE="$RUNNER_TEMP/MyFinance.xcarchive"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          cd "$ARCHIVE/Products/Applications"
          zip -r "$GITHUB_WORKSPACE/MyFinance-${VERSION}-ios-unsigned.zip" App.app
          ls -la "$GITHUB_WORKSPACE/MyFinance-${VERSION}-ios-unsigned.zip"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: MyFinance-*-ios-unsigned.zip
          if-no-files-found: error

  release:
    needs: [build-mac, build-win, build-pwa, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist-release/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist-release/windows

      - name: Download PWA artifacts
        uses: actions/download-artifact@v4
        with:
          name: pwa
          path: dist-release/pwa

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: dist-release/ios

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/macos/*
            dist-release/windows/*
            dist-release/pwa/*
            dist-release/ios/*
