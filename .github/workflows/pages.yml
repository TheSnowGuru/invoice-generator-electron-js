name: Deploy PWA (GitHub Pages)

# Publish static files to gh-pages; GitHub builds the site from that branch.
# (Actions artifact + deploy-pages was stuck in deployment_queued on this repo.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive PWA password hash
        run: |
          if [ -z "${{ secrets.PWA_PASSWORD }}" ]; then
            echo "::error::Add repository secret PWA_PASSWORD (Pages build requires it)."
            exit 1
          fi
          HASH=$(printf '%s' "${{ secrets.PWA_PASSWORD }}" | sha256sum | awk '{print $1}')
          echo "VITE_PWA_PASSWORD_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Build PWA for GitHub Pages
        run: npm run build:pwa
        env:
          VITE_PWA_BASE: /invoice-generator-electron-js/

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          enable_jekyll: false
          commit_message: 'Deploy PWA ${{ github.sha }}'
