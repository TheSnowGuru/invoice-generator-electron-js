name: Deploy PWA (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive PWA password hash
        run: |
          if [ -z "${{ secrets.PWA_PASSWORD }}" ]; then
            echo "::error::Add repository secret PWA_PASSWORD (Pages build requires it)."
            exit 1
          fi
          HASH=$(printf '%s' "${{ secrets.PWA_PASSWORD }}" | sha256sum | awk '{print $1}')
          echo "VITE_PWA_PASSWORD_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Build PWA for GitHub Pages
        run: npm run build:pwa
        env:
          VITE_PWA_BASE: /invoice-generator-electron-js/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
